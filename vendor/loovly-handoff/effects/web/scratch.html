<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scratch-off — Loovly effect (web 480x270)</title>
<link rel="stylesheet" href="../fx/fx.css">
<style>
  html,body{height:100%}
  /* the gray is a viewing mat only — the effect layer itself is transparent */
  body{margin:0;background:#818181;overflow:hidden;display:grid;place-items:center}
  .stage{position:relative;width:480px;height:270px;overflow:hidden;outline:1px dashed rgba(0,0,0,.35);background:none}
  .stage .phone-scr{position:relative;z-index:1;width:100%;height:100%}
  .stage .fxroot{position:static}
  .scratchbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:200px;z-index:2;border-radius:8px;overflow:hidden}
  .scratchbox .cardfx{position:absolute;inset:0}
</style>
</head>
<body>
<div class="stage phone-body">
  <div class="phone-scr"><div class="scratchbox cin-art"><div class="cardfx"></div></div></div>
  <div class="fxroot"></div>
</div>
<script src="../fx/fx.js"></script>
<script>
const idx=LoovlyFX.EFFECTS.findIndex(e=>e.id==="scratch");
document.querySelectorAll(".fxroot").forEach(el=>LoovlyFX.mount(el,idx));
const cf=document.querySelector(".cardfx");if(cf)LoovlyFX.mountCard(cf,idx);
const st=document.querySelector(".stage");
function fit(){const s=Math.min(innerWidth*0.94/480,innerHeight*0.94/270);st.style.transform=`scale(${s})`;}
addEventListener("resize",fit);fit();
</script>
</body>
</html>
