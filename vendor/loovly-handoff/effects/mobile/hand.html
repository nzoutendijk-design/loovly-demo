<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handwriting — Loovly effect (mobile 390x845)</title>
<link rel="stylesheet" href="../fx/fx.css">
<style>
  html,body{height:100%}
  /* the gray is a viewing mat only — the effect layer itself is transparent */
  body{margin:0;background:#818181;overflow:hidden;display:grid;place-items:center}
  .stage{position:relative;width:390px;height:845px;overflow:hidden;outline:1px dashed rgba(0,0,0,.35);background:none}
  .stage .phone-scr{position:relative;z-index:1;width:100%;height:100%}
  .stage .fxroot{position:static}
</style>
</head>
<body>
<div class="stage phone-body">
  <div class="phone-scr"><i class="cin-art" style="display:none"></i></div>
  <div class="fxroot"></div>
</div>
<script src="../fx/fx.js"></script>
<script>
const idx=LoovlyFX.EFFECTS.findIndex(e=>e.id==="hand");
document.querySelectorAll(".fxroot").forEach(el=>LoovlyFX.mount(el,idx));
const cf=document.querySelector(".cardfx");if(cf)LoovlyFX.mountCard(cf,idx);
const st=document.querySelector(".stage");
function fit(){const s=Math.min(innerWidth*0.94/390,innerHeight*0.94/845);st.style.transform=`scale(${s})`;}
addEventListener("resize",fit);fit();
document.addEventListener("animationiteration",ev=>{
  const el=ev.target;
  if(!el.classList||!el.classList.contains("hw"))return;
  const scr=el.closest(".phone-body");if(!scr)return;
  const R=scr.getBoundingClientRect(),B=el.getBoundingClientRect();
  if(!R.width||!B.width)return;
  const wp=B.width/R.width*100,hp=B.height/R.height*100;
  const sibs=[...scr.querySelectorAll(".hw")].filter(s=>s!==el)
    .map(s=>({x:parseFloat(s.style.left)||0,y:parseFloat(s.style.top)||0}));
  let x=2,y=2;
  for(let t=0;t<14;t++){
    x=2+Math.random()*Math.max(1,96-wp);
    y=2+Math.random()*Math.max(1,92-hp);
    if(!sibs.some(s=>Math.abs(s.x-x)<wp*0.85&&Math.abs(s.y-y)<hp*1.1))break;
  }
  el.style.left=x.toFixed(1)+"%";
  el.style.top=y.toFixed(1)+"%";
});
</script>
</body>
</html>
